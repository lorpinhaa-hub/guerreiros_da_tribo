name: Build APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Instalar Expo CLI
        run: npm install -g @expo/cli

      - name: Gerar APK
        run: npx expo export:embed --platform android --dev false --entry-file App.js --bundle-output index.android.bundle --assets-dest android/app/src/main/res/

      - name: Empacotar APK (alternativa simples)
        run: |
          echo "APK sendo preparado..."
          mkdir -p build
          zip -r build/app-bundle.zip . -x "node_modules/*"
          mv build/app-bundle.zip Guerreiros-da-Tribo-App.zip

      - name: Salvar pacote
        uses: actions/upload-artifact@v4
        with:
          name: Guerreiros-da-Tribo-APK
          path: Guerreiros-da-Tribo-App.zip
          retention-days: 30
